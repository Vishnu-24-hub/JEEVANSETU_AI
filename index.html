<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>JEEVANSETU AI</title>
    <script>
      (() => {
        const l = window.location;
        const pathname = l.pathname || '/';
        const repoBase = pathname.split('/').slice(0, 2).join('/') || '';
        const suffix = pathname.startsWith(repoBase) ? pathname.slice(repoBase.length) || '/' : '/';
        const target = `${l.protocol}//${l.hostname}${l.port ? ':' + l.port : ''}${repoBase}/?p=${encodeURIComponent(suffix)}${l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : ''}${l.hash || ''}`;
        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
